name: Release

# One button in the Actions tab cuts a release: pick a bump, or type an exact
# version, and the run bumps, tags, builds, publishes and updates the tap.
#
# The tag is pushed with GITHUB_TOKEN, which does not trigger other workflows.
# That is deliberate -- there is no tag-triggered workflow to loop back into.

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version bump
        type: choice
        default: patch
        options:
          - patch
          - minor
          - major
      version:
        description: Exact version, overrides bump (e.g. 1.13.0)
        type: string
        required: false

permissions:
  contents: write
  pull-requests: write

jobs:
  publish:
    runs-on: macos-latest
    outputs:
      version: ${{ steps.resolve.outputs.version }}
      sha: ${{ steps.build.outputs.sha }}
    steps:
      - uses: actions/checkout@v4

      - name: Resolve version
        id: resolve
        env:
          BUMP: ${{ inputs.bump }}
          EXACT: ${{ inputs.version }}
        run: |
          set -euo pipefail
          CURRENT=$(/usr/libexec/PlistBuddy -c "Print :CFBundleShortVersionString" Info.plist)
          IFS='.' read -r MAJOR MINOR PATCH <<< "$CURRENT"
          if [ -n "$EXACT" ]; then
            V="$EXACT"
          else
            case "$BUMP" in
              major) V="$((MAJOR + 1)).0.0" ;;
              minor) V="$MAJOR.$((MINOR + 1)).0" ;;
              *)     V="$MAJOR.$MINOR.$((PATCH + 1))" ;;
            esac
          fi
          # An unvalidated version reaches a release tag and the tap cask, where
          # a typo ships a bundle nobody can match to a version.
          [[ "$V" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]] || {
            echo "::error::'$V' is not a MAJOR.MINOR.PATCH version"; exit 1; }
          echo "version=$V" >> "$GITHUB_OUTPUT"
          echo "Releasing v$V (current $CURRENT)"

      - name: Bump version and tag the merge commit
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          # Bump both files or the updater rejects the build: package.sh exits 2
          # when Info.plist and Version.swift disagree.
          BR="release/v$VERSION"
          git checkout -b "$BR"
          /usr/libexec/PlistBuddy -c "Set :CFBundleShortVersionString $VERSION" Info.plist
          /usr/libexec/PlistBuddy -c "Set :CFBundleVersion $VERSION" Info.plist
          sed -i '' "s/^public let appVersion = \".*\"/public let appVersion = \"$VERSION\"/" \
            Sources/QuickTodoCore/Version.swift
          grep -q "appVersion = \"$VERSION\"" Sources/QuickTodoCore/Version.swift || {
            echo "Version.swift update failed"; exit 1; }
          git add Info.plist Sources/QuickTodoCore/Version.swift
          git commit -m "Bump version to $VERSION"
          git push -u origin "$BR"

          PR_URL=$(gh pr create --base main --head "$BR" --title "Release v$VERSION" \
            --body "Bumps the version to $VERSION for release.")
          gh pr merge --merge --delete-branch || {
            echo "error: could not merge $BR into main automatically." >&2
            echo "       The version bump is committed and pushed, and its PR is still open:" >&2
            echo "         $PR_URL" >&2
            echo "       Re-run this workflow once it is merged." >&2
            exit 1
          }

          # Build the tagged commit, not the bump commit.
          git checkout main
          git fetch origin main
          git reset --hard origin/main
          git tag "v$VERSION"
          git push origin "v$VERSION"

      - name: Build, verify and publish
        id: build
        env:
          VERSION: ${{ steps.resolve.outputs.version }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          CREATE_ARCHIVE=1 ./scripts/package.sh local

          # The tag and the shipped bundle must agree, or the updater shows a
          # permanent "update available" that installs nothing.
          BUILT=$(/usr/libexec/PlistBuddy \
            -c "Print :CFBundleShortVersionString" dist/quicktodo.app/Contents/Info.plist)
          if [ "$BUILT" != "$VERSION" ]; then
            echo "::error::built bundle reports $BUILT but the release is v$VERSION"; exit 1
          fi

          gh release create "v$VERSION" --title "v$VERSION" --generate-notes \
            quicktodo.app.zip quicktodo.app.zip.sha256

          # ditto embeds mtimes, so every rebuild is a different zip. This SHA is
          # only valid for the asset uploaded just above.
          echo "sha=$(shasum -a 256 quicktodo.app.zip | awk '{print $1}')" >> "$GITHUB_OUTPUT"

  tap:
    needs: publish
    runs-on: macos-latest
    steps:
      # GITHUB_TOKEN cannot reach another repo, so the tap needs its own token.
      - name: Require the tap token
        env:
          TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          if [ -z "$TAP_TOKEN" ]; then
            echo "::error::Missing secret HOMEBREW_TAP_TOKEN: a token with write access to mdopeace/homebrew-quicktodo"
            exit 1
          fi

      - uses: actions/checkout@v4
        with:
          repository: mdopeace/homebrew-quicktodo
          ref: main
          path: mdopeace/homebrew-quicktodo
          token: ${{ secrets.HOMEBREW_TAP_TOKEN }}

      - uses: actions/checkout@v4
        with:
          path: app

      - name: Point the tap at the new release
        env:
          GH_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
          VERSION: ${{ needs.publish.outputs.version }}
          SHA: ${{ needs.publish.outputs.sha }}
        run: |
          set -euo pipefail
          TAP_DIR=mdopeace/homebrew-quicktodo ./app/scripts/update-tap.sh "$VERSION" "$SHA"
