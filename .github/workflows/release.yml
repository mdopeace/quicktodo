name: Release

on:
  push:
    tags: ['v*']

permissions:
  contents: write
  pull-requests: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Build release artifact
        run: CREATE_ARCHIVE=1 ./scripts/package.sh local
      - name: Create source tarball
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          git archive --format=tar.gz --prefix="quicktodo-${TAG}/" "${TAG}" > "quicktodo-${TAG}.tar.gz"
          shasum -a 256 "quicktodo-${TAG}.tar.gz" > "quicktodo-${TAG}.tar.gz.sha256"
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            quicktodo.app.zip
            quicktodo.app.zip.sha256
            quicktodo-${{ github.ref_name }}.tar.gz
            quicktodo-${{ github.ref_name }}.tar.gz.sha256
          generate_notes: true
      - name: Update Homebrew Tap
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          HOMEBREW_TAP_TOKEN: ${{ secrets.HOMEBREW_TAP_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          
          # Clone tap repo
          git clone https://x-access-token:${HOMEBREW_TAP_TOKEN}@github.com/mdopeace/homebrew-quicktodo.git homebrew-quicktodo
          cd homebrew-quicktodo
          
          # Update formula
          SRC_SHA=$(shasum -a 256 ../quicktodo-${TAG}.tar.gz | awk '{print $1}')
          sed -i '' "s#tags/v[0-9.]*\\.tar\\.gz#tags/v${VERSION}.tar.gz#" Formula/quicktodo.rb
          sed -i '' "s/sha256 \"[0-9a-f]*\"/sha256 \"${SRC_SHA}\"/" Formula/quicktodo.rb
          
          # Commit and PR
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git checkout -b "quicktodo-v${VERSION}"
          git add -A
          git commit -m "quicktodo ${VERSION}"
          git push -u origin "quicktodo-v${VERSION}"
          
          # Create PR via gh CLI
          gh pr create --base main --head "quicktodo-v${VERSION}" --title "quicktodo ${VERSION}" --body "Releases quicktodo v${VERSION}."
          gh pr merge --merge --delete-branch "quicktodo-v${VERSION}"