name: Build & Test

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: swift test
      - name: Build app
        run: ./scripts/package.sh local
      - name: Verify codesign
        run: codesign --verify --deep --strict dist/quicktodo.app
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: quicktodo.app
          path: dist/quicktodo.app
          retention-days: 7